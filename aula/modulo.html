<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo — Introducción a la IA · Especializate</title>
  <link rel="stylesheet" href="aula.css">
</head>
<body data-screen="modulo">
  <div class="container screen-wide">
    <main data-page-main>
      <!-- La pantalla se renderiza acá desde course.config.js + progress.js -->
      <div data-modulo-intro></div>
    </main>
  </div>

  <!-- Toast compartido (avisos de la lógica) -->
  <div id="toast" role="alert" aria-live="assertive" class="toast-info">
    <span class="toast-icon" data-toast-icon aria-hidden="true"></span>
    <span id="toast-message">Aviso</span>
  </div>

  <!-- Contenido -->
  <script src="course.config.js"></script>
  <script src="progress.js"></script>
  <script src="screens.js"></script>
  <script>AulaScreens.initModulo();</script>
  <!-- App-shell: sidebar + header -->
  <script src="shell.js"></script>
  <!-- Ayuda guiada (product tour) -->
  <script src="tour.js"></script>
  <script>AulaTour.init('modulo');</script>
</body>
</html>
